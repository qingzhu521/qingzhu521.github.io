title: qingzhu521's Blog
description: 技术笔记与思考
theme: minima
plugins:
  - jekyll-feed

minima:
  skin: dark

markdown: kramdown
permalink: /:year/:month/:day/:title/

# Cloudflare Pages 部署地址（项目名 qingzhu521-blog → qingzhu521-blog.pages.dev）
# 如绑自定义域名，把 url 改为对应域名即可
url: "https://qingzhu521-blog.pages.dev"
baseurl: ""

# 排除不需要进 _site 的文件
exclude:
  - .github
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - DESIGN.md
  - wrangler.toml
